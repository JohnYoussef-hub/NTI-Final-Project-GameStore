<p-toast></p-toast>

<div
  style="
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    width: 100%;
    background-color: #f8fafc;
  "
>
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-10 border border-slate-100">
    <header class="flex flex-col items-center text-center pb-8">
      <div
        class="w-16 h-16 bg-slate-900 rounded-2xl shadow-md flex items-center justify-center mb-5 transform rotate-3"
      >
        <i class="pi pi-shield text-3xl text-white -rotate-3"></i>
      </div>
      <h1 class="text-3xl font-extrabold text-slate-800">Welcome Back</h1>
      <p class="text-slate-500 text-sm mt-2 font-medium">Sign in to manage GameStore</p>
    </header>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
      <div class="flex flex-col gap-2">
        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider"
          >Email Address</label
        >
        <input
          pInputText
          type="email"
          formControlName="email"
          class="w-full p-3 border-slate-300 focus:border-slate-900 transition-colors"
          placeholder="admin@example.com"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">Password</label>
        <input
          pInputText
          type="password"
          formControlName="password"
          class="w-full p-3 border-slate-300 focus:border-slate-900 transition-colors"
          placeholder="••••••••"
        />
      </div>

      <p-button
        label="Sign In"
        icon="pi pi-arrow-right"
        iconPos="right"
        type="submit"
        [disabled]="loginForm.invalid || isLoading()"
        [loading]="isLoading()"
        styleClass="w-full py-3 mt-2 !bg-slate-900 !border-slate-900 hover:!bg-slate-800 transition-colors"
      ></p-button>
    </form>
    <p class="text-center text-sm text-slate-500 mt-6 font-medium">
      Don't have an account?
      <a routerLink="/signup" class="text-slate-900 font-bold hover:underline">Sign in</a>
    </p>
  </div>
</div>
