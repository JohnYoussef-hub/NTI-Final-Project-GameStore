<p-toast></p-toast>

<div class="min-h-screen w-full bg-[#020817] px-4 py-8">
  <div class="mx-auto grid max-w-5xl overflow-hidden rounded-[32px] border border-cyan-500/20 bg-[#0f172a]/90 shadow-[0_0_45px_rgba(59,130,246,0.25)] backdrop-blur md:grid-cols-[1.1fr_0.9fr]">
    <div class="relative hidden min-h-[700px] overflow-hidden md:block">
      <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_left,_rgba(34,211,238,0.25),_transparent_30%),radial-gradient(circle_at_bottom_right,_rgba(168,85,247,0.22),_transparent_35%)]"></div>
      <img
        src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1200&q=80"
        alt="Gaming illustration"
        class="h-full w-full object-cover opacity-80"
      />
      <div class="absolute inset-0 bg-gradient-to-r from-[#020817]/70 via-[#0f172a]/20 to-transparent"></div>

      <div class="absolute bottom-0 left-0 right-0 p-8 text-white">
        <div class="mb-4 inline-flex items-center gap-2 rounded-full border border-white/20 bg-white/10 px-3 py-1 text-xs font-bold uppercase tracking-[0.2em] text-cyan-100 backdrop-blur-sm">
          <i class="pi pi-gamepad text-sm"></i> GameStore
        </div>
        <h2 class="text-4xl font-black leading-tight">Level up your library.</h2>
        <p class="mt-3 max-w-md text-sm text-slate-200">Discover next-gen adventures, esports favorites, and iconic worlds in one place.</p>
      </div>
    </div>

    <div class="flex items-center justify-center p-6 md:p-10">
      <div class="w-full max-w-md overflow-hidden rounded-3xl border border-cyan-500/20 bg-[#0f172a]/80 shadow-[0_0_30px_rgba(14,116,144,0.15)]">
        <div class="bg-gradient-to-r from-cyan-500 via-blue-600 to-violet-600 p-8 text-center">
          <div class="mx-auto mb-5 h-20 w-20 overflow-hidden rounded-[26px] border border-white/20 shadow-[0_10px_25px_rgba(14,116,144,0.35)] backdrop-blur-sm bg-[radial-gradient(circle_at_50%_30%,#8ae3f7_0%,#7dd3fc_35%,#2dd4bf_100%)]">
            <div class="relative h-full w-full">
              <div class="absolute left-1/2 top-[12%] h-7 w-7 -translate-x-1/2 rounded-full bg-[#0f172a] shadow-[0_0_0_3px_rgba(255,255,255,0.18)]"></div>
              <div class="absolute left-1/2 top-[34%] h-8 w-11 -translate-x-1/2 rounded-[18px] bg-[#0f172a]"></div>
              <div class="absolute left-[18%] top-[40%] h-2.5 w-2.5 rounded-full bg-slate-200/80"></div>
              <div class="absolute right-[18%] top-[40%] h-2.5 w-2.5 rounded-full bg-slate-200/80"></div>
              <div class="absolute left-1/2 top-[52%] h-4 w-7 -translate-x-1/2 rounded-full bg-slate-200/70"></div>
              <div class="absolute left-1/2 top-[68%] h-5 w-12 -translate-x-1/2 rounded-t-[18px] rounded-b-[12px] bg-[#0f172a]"></div>
            </div>
          </div>
          <h1 class="text-3xl font-black tracking-tight text-white">Welcome Back</h1>
          <p class="mt-2 text-sm text-cyan-100/90">Sign in to manage GameStore</p>
        </div>

        <div class="space-y-6 p-8">
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
            <div class="space-y-2">
              <label class="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Email Address</label>
              <input
                pInputText
                type="email"
                formControlName="email"
                class="w-full border border-slate-700 bg-slate-950/70 p-3 text-white placeholder:text-slate-500 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/20"
                placeholder="admin@example.com"
              />
            </div>

            <div class="space-y-2">
              <label class="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Password</label>
              <input
                pInputText
                type="password"
                formControlName="password"
                class="w-full border border-slate-700 bg-slate-950/70 p-3 text-white placeholder:text-slate-500 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/20"
                placeholder="••••••••"
              />
            </div>

            <p-button
              label="Sign In"
              icon="pi pi-arrow-right"
              iconPos="right"
              type="submit"
              [disabled]="loginForm.invalid || isLoading()"
              [loading]="isLoading()"
              styleClass="w-full !bg-gradient-to-r !from-cyan-500 !to-blue-600 !border-0 !text-white !font-bold !rounded-xl !py-3 hover:!brightness-110 transition-all"
            ></p-button>
          </form>

          <div class="text-right">
            <a routerLink="/forgot-password" class="text-sm font-bold text-cyan-300 hover:text-cyan-200">Forgot password?</a>
          </div>

          <p class="text-center text-sm text-slate-400">
            Don't have an account?
            <a routerLink="/signup" class="font-bold text-cyan-300 hover:text-cyan-200">Create one</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
