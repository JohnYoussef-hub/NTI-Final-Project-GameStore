<p-toast></p-toast>

<div class="min-h-screen w-full bg-[#020817] px-4 py-8">
  <div class="mx-auto max-w-md overflow-hidden rounded-[32px] border border-cyan-500/20 bg-[#0f172a]/90 shadow-[0_0_45px_rgba(59,130,246,0.25)] backdrop-blur">
    <div class="bg-gradient-to-r from-cyan-500 via-blue-600 to-violet-600 p-8 text-center">
      <div class="mx-auto mb-5 h-20 w-20 overflow-hidden rounded-[26px] border border-white/20 shadow-[0_10px_25px_rgba(14,116,144,0.35)] bg-[radial-gradient(circle_at_50%_30%,#8ae3f7_0%,#7dd3fc_35%,#2dd4bf_100%)]">
        <div class="relative h-full w-full">
          <div class="absolute left-1/2 top-[12%] h-7 w-7 -translate-x-1/2 rounded-full bg-[#0f172a]"></div>
          <div class="absolute left-1/2 top-[34%] h-8 w-11 -translate-x-1/2 rounded-[18px] bg-[#0f172a]"></div>
          <div class="absolute left-1/2 top-[52%] h-4 w-7 -translate-x-1/2 rounded-full bg-slate-200/70"></div>
        </div>
      </div>
      <h1 class="text-3xl font-black tracking-tight text-white">Reset Password</h1>
      <p class="mt-2 text-sm text-cyan-100/90">Enter the OTP and your new password.</p>
    </div>

    <div class="space-y-6 p-8">
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
        <div class="space-y-2">
          <label class="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">OTP</label>
          <input
            pInputText
            type="text"
            formControlName="otp"
            class="w-full border border-slate-700 bg-slate-950/70 p-3 text-white placeholder:text-slate-500 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/20"
            placeholder="123456"
          />
        </div>

        <div class="space-y-2">
          <label class="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">New Password</label>
          <input
            pInputText
            type="password"
            formControlName="password"
            class="w-full border border-slate-700 bg-slate-950/70 p-3 text-white placeholder:text-slate-500 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/20"
            placeholder="••••••••"
          />
        </div>

        <p-button
          label="Reset Password"
          icon="pi pi-check"
          iconPos="right"
          type="submit"
          [disabled]="form.invalid || isLoading()"
          [loading]="isLoading()"
          styleClass="w-full !bg-gradient-to-r !from-cyan-500 !to-blue-600 !border-0 !text-white !font-bold !rounded-xl !py-3 hover:!brightness-110 transition-all"
        ></p-button>
      </form>

      <div class="text-center">
        <button
          type="button"
          (click)="resendOtp()"
          [disabled]="isResending()"
          class="text-sm font-bold text-cyan-300 hover:text-cyan-200 disabled:text-slate-500"
        >
          {{ isResending() ? 'Sending...' : 'Resend OTP' }}
        </button>
      </div>

      <p class="text-center text-sm text-slate-400">
        Back to
        <a routerLink="/login" class="font-bold text-cyan-300 hover:text-cyan-200">Login</a>
      </p>
    </div>
  </div>
</div>
