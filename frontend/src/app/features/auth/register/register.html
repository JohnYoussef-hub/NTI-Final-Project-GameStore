<p-toast></p-toast>

<div class="min-h-screen w-full flex items-center justify-center bg-[#020817] px-4 py-8">
  <div class="w-full max-w-md overflow-hidden rounded-3xl border border-cyan-500/20 bg-[#0f172a]/90 shadow-[0_0_40px_rgba(59,130,246,0.25)] backdrop-blur">
    <div class="bg-gradient-to-r from-cyan-500 via-blue-600 to-violet-600 p-8 text-center">
      <div class="mx-auto mb-5 h-20 w-20 overflow-hidden rounded-[26px] border border-white/20 shadow-[0_10px_25px_rgba(14,116,144,0.35)] backdrop-blur-sm bg-[radial-gradient(circle_at_50%_30%,#8ae3f7_0%,#7dd3fc_35%,#2dd4bf_100%)]">
        <div class="relative h-full w-full">
          <div class="absolute left-1/2 top-[12%] h-7 w-7 -translate-x-1/2 rounded-full bg-[#0f172a] shadow-[0_0_0_3px_rgba(255,255,255,0.18)]"></div>
          <div class="absolute left-1/2 top-[34%] h-8 w-11 -translate-x-1/2 rounded-[18px] bg-[#0f172a]"></div>
          <div class="absolute left-[18%] top-[40%] h-2.5 w-2.5 rounded-full bg-slate-200/80"></div>
          <div class="absolute right-[18%] top-[40%] h-2.5 w-2.5 rounded-full bg-slate-200/80"></div>
          <div class="absolute left-1/2 top-[52%] h-4 w-7 -translate-x-1/2 rounded-full bg-slate-200/70"></div>
          <div class="absolute left-1/2 top-[68%] h-5 w-12 -translate-x-1/2 rounded-t-[18px] rounded-b-[12px] bg-[#0f172a]"></div>
        </div>
      </div>
      <h1 class="text-3xl font-black tracking-tight text-white">Create Account</h1>
      <p class="mt-2 text-sm text-cyan-100/90">Register to start your GameStore journey</p>
    </div>

    <div class="space-y-6 p-8">
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-5">
        <div class="space-y-2">
          <label class="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Full Name</label>
          <input
            pInputText
            type="text"
            formControlName="name"
            class="w-full border border-slate-700 bg-slate-950/70 p-3 text-white placeholder:text-slate-500 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/20"
            placeholder="John Doe"
          />
        </div>

        <div class="space-y-2">
          <label class="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Email Address</label>
          <input
            pInputText
            type="email"
            formControlName="email"
            class="w-full border border-slate-700 bg-slate-950/70 p-3 text-white placeholder:text-slate-500 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/20"
            placeholder="admin@example.com"
          />
        </div>

        <div class="space-y-2">
          <label class="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Password</label>
          <input
            pInputText
            type="password"
            formControlName="password"
            class="w-full border border-slate-700 bg-slate-950/70 p-3 text-white placeholder:text-slate-500 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-500/20"
            placeholder="••••••••"
          />
        </div>

        <p-button
          label="Sign Up"
          icon="pi pi-arrow-right"
          iconPos="right"
          type="submit"
          [disabled]="registerForm.invalid || isLoading()"
          [loading]="isLoading()"
          styleClass="w-full !bg-gradient-to-r !from-cyan-500 !to-blue-600 !border-0 !text-white !font-bold !rounded-xl !py-3 hover:!brightness-110 transition-all"
        ></p-button>
      </form>

      <p class="text-center text-sm text-slate-400">
        Already have an account?
        <a routerLink="/login" class="font-bold text-cyan-300 hover:text-cyan-200">Sign in</a>
      </p>
    </div>
  </div>
</div>
