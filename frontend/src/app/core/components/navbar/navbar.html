<nav
  class="sticky top-0 z-50 bg-slate-900/95 backdrop-blur-md text-white px-8 py-4 flex justify-between items-center shadow-lg border-b border-slate-800"
>
  <a
    routerLink="/home"
    class="text-2xl font-extrabold tracking-wide flex items-center gap-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400"
  >
    <i class="pi pi-sparkles text-blue-400"></i>
    GameStore
  </a>

  <div class="flex items-center gap-6 font-medium text-sm">
    @if (!isLoggedIn) {
      <a
        routerLink="/home"
        routerLinkActive="text-blue-400"
        class="text-slate-300 hover:text-white transition-colors flex items-center gap-2"
      >
        <i class="pi pi-home"></i> Home
      </a>
      <a
        routerLink="/login"
        routerLinkActive="text-blue-400"
        class="text-slate-300 hover:text-white transition-colors flex items-center gap-2"
      >
        <i class="pi pi-sign-in"></i> Login
      </a>
      <a
        routerLink="/signup"
        class="bg-blue-600 px-5 py-2 rounded-lg font-bold hover:bg-blue-500 shadow-md shadow-blue-900/50 transition-all transform hover:-translate-y-0.5 flex items-center gap-2"
      >
        Sign Up
      </a>
    } @else {
      @if (!isAdmin) {
        <a
          routerLink="/home"
          routerLinkActive="text-blue-400"
          [routerLinkActiveOptions]="{ exact: true }"
          class="text-slate-300 hover:text-white transition-colors flex items-center gap-2"
        >
          <i class="pi pi-home"></i> Home
        </a>
      }

      @if (isAdmin) {
        <a
          routerLink="/admin"
          routerLinkActive="text-blue-400"
          class="text-slate-300 hover:text-white transition-colors flex items-center gap-2"
        >
          <i class="pi pi-gauge"></i> Dashboard
        </a>
      }

      @if (!isAdmin) {
        <a
          routerLink="/wishlist"
          routerLinkActive="text-blue-400"
          class="text-slate-300 hover:text-white transition-colors flex items-center gap-2"
        >
          <i class="pi pi-heart"></i> Wishlist
        </a>
      }

      <a
        routerLink="/profile"
        routerLinkActive="text-blue-400"
        class="text-slate-300 hover:text-white transition-colors flex items-center gap-2"
      >
        <i class="pi pi-user"></i> Profile
      </a>

      <button
        (click)="logout()"
        class="ml-2 bg-slate-800 text-rose-400 border border-rose-500/30 px-4 py-2 rounded-lg font-bold hover:bg-rose-600 hover:text-white transition-all flex items-center gap-2"
      >
        <i class="pi pi-sign-out"></i> Logout
      </button>
    }
  </div>
</nav>
