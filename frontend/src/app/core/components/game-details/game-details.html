<div class="min-h-screen bg-gray-950 text-white p-8">
  <div class="max-w-4xl mx-auto">

    <!-- Back Button -->
    <a routerLink="/" class="inline-block mb-6 bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg text-sm transition">
      &larr; Back to Games
    </a>

    @if (loading) {
      <div class="text-center py-20 text-gray-400">Loading game details...</div>
    } @else if (game) {
      <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden p-6 md:p-8 shadow-xl">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

          <!-- Game Image -->
          <div>
            <img [src]="game.images[0]" [alt]="game.title" class="w-full h-80 object-cover rounded-lg border border-gray-800" />
          </div>

          <!-- Game Info -->
          <div>
            <h1 class="text-3xl md:text-4xl font-bold mb-4">{{ game.title }}</h1>

            <div class="mb-4">
              <span class="bg-blue-900 text-blue-300 px-3 py-1 rounded-full text-xs font-semibold mr-2">
                {{ game.genre }}
              </span>
              <span class="text-gray-400 text-sm">Stock: {{ game.stock }} available</span>
            </div>

            <p class="text-gray-300 mb-6 leading-relaxed">{{ game.description }}</p>

            <div class="mb-6">
              <h3 class="text-sm font-semibold text-gray-400 mb-2">Platforms:</h3>
              <div class="flex flex-wrap gap-2">
                @for (platform of game.platform; track platform) {
                  <span class="bg-gray-800 text-gray-300 px-3 py-1 rounded text-xs">{{ platform }}</span>
                }
              </div>
            </div>

            <div class="flex items-center justify-between border-t border-gray-800 pt-6">
              <span class="text-3xl font-bold text-blue-400">${{ game.price }}</span>
              <button
                (click)="addToWishlist()"
                class="bg-blue-600 hover:bg-blue-700 px-6 py-2.5 rounded-lg font-semibold transition">
                Add to Wishlist
              </button>
            </div>
          </div>

        </div>
      </div>
    } @else {
      <div class="text-center py-20 text-red-400">Game not found.</div>
    }

  </div>
</div>
